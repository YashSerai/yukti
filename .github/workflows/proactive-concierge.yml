name: Proactive concierge

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check due work without sending
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: yukti-proactive-concierge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run due concierge work
        env:
          YUKTI_SCHEDULER_SECRET: ${{ secrets.YUKTI_SCHEDULER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          test -n "$YUKTI_SCHEDULER_SECRET"
          suffix=""
          if [ "$DRY_RUN" = "true" ]; then suffix="?dry_run=1"; fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $YUKTI_SCHEDULER_SECRET" \
            "https://yukti.yashns.chatgpt.site/api/jobs/proactive${suffix}"
